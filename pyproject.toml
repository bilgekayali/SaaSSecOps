[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saassecops"
version = "0.1.0"
description = "AWS SaaS Security & Trust Reference Architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Bilge Kayalı"}]

[project.scripts]
saassecops = "saassecops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
