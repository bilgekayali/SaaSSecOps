name: Release Evidence

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install -e .
          python -m pip install build
      - name: Verify stable contract and tagged source tests
        run: |
          python scripts/verify_stable_contract.py
          python -m unittest discover -s tests -v
      - name: Build distribution
        run: python -m build
      - name: Clean wheel install and CLI smoke
        run: |
          python -m venv /tmp/saassecops-release
          /tmp/saassecops-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/saassecops-release/bin/saassecops --version
          /tmp/saassecops-release/bin/saassecops contract-snapshot > /tmp/saassecops-contract-snapshot.json
          /tmp/saassecops-release/bin/saassecops validate "$GITHUB_WORKSPACE/examples/reference-architecture.json" --kind posture
      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate_sbom.py --output artifacts/saassecops.cdx.json
          python scripts/verify_sbom.py artifacts/saassecops.cdx.json
      - name: Generate release manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/generate_release_manifest.py \
            --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --artifact-dir dist \
            --sbom artifacts/saassecops.cdx.json \
            --output artifacts/release-manifest.json
          saassecops validate artifacts/release-manifest.json --kind release-manifest
      - name: Release-candidate review
        if: github.ref_name == 'v0.9.0'
        run: |
          python scripts/verify_release_candidate.py \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/v1-rc-review.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/
            artifacts/saassecops.cdx.json
            artifacts/release-manifest.json
            artifacts/v1-rc-review.json
            contracts/v1-candidate.json
            contracts/v1-candidate.sha256
            release/v1-rc-checklist.json
            release/defect-register.json
          if-no-files-found: error
