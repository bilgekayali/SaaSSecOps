name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Reference assessment
        run: |
          PYTHONPATH=src python -m saassecops assess \
            examples/reference-architecture.json \
            --policy policies/aws-saas-controls.json \
            --output artifacts/reference-assessment.json
      - name: Risky assessment must expose gaps
        run: |
          set +e
          PYTHONPATH=src python -m saassecops assess \
            examples/risky-architecture.json \
            --policy policies/aws-saas-controls.json \
            --output artifacts/risky-assessment.json
          code=$?
          test "$code" -eq 2
