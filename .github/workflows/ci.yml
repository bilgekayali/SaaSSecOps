name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit and repository contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate public contracts
        run: |
          saassecops validate examples/reference-architecture.json --kind posture
          saassecops validate policies/aws-saas-controls.json --kind policy
          saassecops validate architecture/multi-account-reference.json --kind multi-account
          saassecops contract-snapshot
      - name: Reference assessment and evidence manifest
        run: saassecops assess examples/reference-architecture.json --policy policies/aws-saas-controls.json --output artifacts/reference-assessment.json --manifest-output artifacts/reference-manifest.json
      - name: Validate generated evidence
        run: |
          saassecops validate artifacts/reference-assessment.json --kind report
          saassecops validate artifacts/reference-manifest.json --kind manifest
      - name: Risky assessment must expose gaps
        run: |
          set +e
          saassecops assess examples/risky-architecture.json --policy policies/aws-saas-controls.json --output artifacts/risky-assessment.json
          code=$?
          test "$code" -eq 2
      - name: Build package
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - infra/terraform
          - infra/organization
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
