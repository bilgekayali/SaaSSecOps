name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit and repository contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify stable public contract candidate
        run: python scripts/verify_stable_contract.py
      - name: Validate public contracts
        run: |
          saassecops validate examples/reference-architecture.json --kind posture
          saassecops validate policies/aws-saas-controls.json --kind policy
          saassecops validate architecture/multi-account-reference.json --kind multi-account
          saassecops validate architecture/tenant-isolation-reference.json --kind tenant-isolation
          saassecops validate architecture/appsec-reference.json --kind appsec
          saassecops validate examples/vulnerability-evidence.json --kind vulnerability-evidence
          saassecops validate architecture/customer-trust-reference.json --kind customer-trust
          saassecops validate examples/security-questionnaire.json --kind questionnaire
          saassecops validate examples/trust-exceptions.json --kind trust-exceptions
          saassecops validate examples/key-registry.json --kind key-registry
          saassecops contract-snapshot
      - name: Tenant isolation negative vectors
        run: python scripts/run_isolation_vectors.py
      - name: Customer trust fail-closed checks
        run: python scripts/build_customer_trust_summary.py --output artifacts/customer-trust-summary.json
      - name: Evidence signature freshness and revocation gates
        env:
          SAASSECOPS_SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          python scripts/run_evidence_integrity.py
          saassecops validate artifacts/evidence-envelope.json --kind evidence-envelope
      - name: Generate and verify CycloneDX SBOM
        run: |
          python scripts/generate_sbom.py --output artifacts/saassecops.cdx.json
          python scripts/verify_sbom.py artifacts/saassecops.cdx.json
      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-audit.txt --strict
      - name: Reference assessment and evidence manifest
        run: saassecops assess examples/reference-architecture.json --policy policies/aws-saas-controls.json --output artifacts/reference-assessment.json --manifest-output artifacts/reference-manifest.json
      - name: Validate generated evidence
        run: |
          saassecops validate artifacts/reference-assessment.json --kind report
          saassecops validate artifacts/reference-manifest.json --kind manifest
      - name: Risky assessment must expose gaps
        run: |
          set +e
          saassecops assess examples/risky-architecture.json --policy policies/aws-saas-controls.json --output artifacts/risky-assessment.json
          code=$?
          test "$code" -eq 2
      - name: Build package
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build
      - name: Clean wheel install and CLI smoke
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/saassecops-rc
          /tmp/saassecops-rc/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/saassecops-rc/bin/saassecops --version | grep "0.9.0"
          /tmp/saassecops-rc/bin/saassecops contract-snapshot > /tmp/saassecops-contract-snapshot.json
          /tmp/saassecops-rc/bin/saassecops validate "$GITHUB_WORKSPACE/examples/reference-architecture.json" --kind posture
          /tmp/saassecops-rc/bin/saassecops digest "$GITHUB_WORKSPACE/contracts/v1-candidate.json"
      - name: Bind release artifacts to exact source
        if: matrix.python-version == '3.12'
        run: |
          python scripts/generate_release_manifest.py \
            --version 0.9.0 \
            --source-sha "$CANDIDATE_SHA" \
            --artifact-dir dist \
            --sbom artifacts/saassecops.cdx.json \
            --output artifacts/release-manifest.json
          saassecops validate artifacts/release-manifest.json --kind release-manifest
      - name: Build release-candidate review
        if: matrix.python-version == '3.12'
        run: |
          python scripts/verify_release_candidate.py \
            --source-sha "$CANDIDATE_SHA" \
            --output artifacts/v1-rc-review.json
      - name: Upload release evidence bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: saassecops-release-evidence-${{ env.CANDIDATE_SHA }}
          path: |
            dist/
            artifacts/saassecops.cdx.json
            artifacts/release-manifest.json
            artifacts/evidence-envelope.json
            artifacts/evidence-integrity-summary.json
            artifacts/v1-rc-review.json
            contracts/v1-candidate.json
            contracts/v1-candidate.sha256
            release/v1-rc-checklist.json
            release/defect-register.json
          if-no-files-found: error

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - infra/terraform
          - infra/organization
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.0"
      - name: Terraform init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
